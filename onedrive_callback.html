<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接 OneDrive...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f7;
      color: #333;
      text-align: center;
      padding: 60px 24px 24px 24px;
      box-sizing: border-box;
    }
    #fallback {
      margin-top: 26px;
    }
    #fallback p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #888;
    }
    #fallback a {
      display: inline-block;
      background: #0078D4;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 28px;
      border-radius: 10px;
    }
    #fallback a:active { opacity: 0.85; }
  </style>
</head>
<body>
  <p id="msg">正在跳转回 App，请稍候...</p>

  <!-- 兜底按钮：自动跳转万一没生效（比如设备上没有任何 App 声明处理 trifles:// 协议），
       用户还有一个手动点一下就能回到 App 的办法。这个按钮本身是静态 HTML 的一部分，
       页面一打开就可见，不依赖脚本执行结果；脚本只负责把它的 href 换成真正带授权码的深链接。 -->
  <div id="fallback">
    <p>没有自动跳转？点击下方按钮返回 App</p>
    <a id="fallback-link" href="#">返回 App 完成授权</a>
  </div>

  <script>
    // 跟 google_callback.html / baidu_callback.html 是同一套模式：从这个页面自己的
    // URL 查询参数里取出 code，转发成 App 里 appUrlOpen 监听器能接住的
    // trifles://auth?... 深链接。platform=onedrive 这个参数是 App 侧用来区分
    // 三个网盘回调、决定 dispatch 哪个 xxx_code_received 事件的关键。
    //
    // 双重兜底：正常情况下微软会把 code 放在 ?（query）后面，这里额外也兜底从 #（hash）
    // 读一次，不管走哪种都能读到。
    var searchParams = new URLSearchParams(window.location.search);
    var hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
    var code = searchParams.get('code') || hashParams.get('code');
    var error = searchParams.get('error') || hashParams.get('error');
    var errorDescription = searchParams.get('error_description') || hashParams.get('error_description');

    if (code) {
      var deepLink = 'trifles://auth?platform=onedrive&code=' + encodeURIComponent(code);
      document.getElementById('fallback-link').href = deepLink;

      // 用 requestAnimationFrame 让浏览器先完成一帧真实绘制，再发起跳转——保证不管这次
      // 跳转顺不顺利，用户至少已经能看到页面内容和这个可以手动点的按钮。
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          window.location.href = deepLink;
        });
      });
    } else {
      document.getElementById('msg').textContent =
        '授权失败：' + (errorDescription || error || '未知错误') + '，请返回 App 重试。';
    }
  </script>
</body>
</html>
